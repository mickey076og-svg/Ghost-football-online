name: Create build.yml
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Full Project Automatically
        run: |
          mkdir -p app/src/main/java/com/ghostfootball/game
          mkdir -p app/src/main/res/layout
          
          # settings.gradle
          echo "include ':app'" > settings.gradle
          
          # root build.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'com.google.gms:google-services:4.4.1'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          # app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
          android {
              namespace 'com.ghostfootball.game'
              compileSdk 34
              defaultConfig { applicationId "com.ghostfootball.game"; minSdk 24; targetSdk 34; versionCode 3; versionName "3.0-Italian" }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.firebase:firebase-database:20.3.0'
          }
          EOF
          
          # AndroidManifest
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:allowBackup="true" android:label="Ghost Football Online" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MenuActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="true"/>
              </application>
          </manifest>
          EOF
          
          # Add all other files... (simplified offline version that ALWAYS builds)
          mkdir -p app/src/main/java/com/ghostfootball/game
          echo "package com.ghostfootball.game; import android.content.*; import android.os.*; import android.widget.*; import androidx.appcompat.app.AppCompatActivity; import java.util.Random; public class MenuActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); android.widget.LinearLayout lay=new android.widget.LinearLayout(this); lay.setOrientation(android.widget.LinearLayout.VERTICAL); lay.setPadding(40,40,40,40); lay.setBackgroundColor(0xFF0A4B1A); TextView tv=new TextView(this); tv.setText(\"GHOST FOOTBALL ONLINE\n🇮🇹 Italian Commentator\"); tv.setTextSize(26); tv.setTextColor(0xFFFFFFFF); lay.addView(tv); Button cr=new Button(this); cr.setText(\"CREATE ROOM\"); lay.addView(cr); TextView code=new TextView(this); code.setTextSize(22); code.setTextColor(0xFFFFFF00); lay.addView(code); cr.setOnClickListener(v->{ String c=\"GHOST-\"+(1000+new Random().nextInt(9000)); code.setText(\"Your Code:\\n\"+c); getSharedPreferences(\"game\",0).edit().putString(\"room\",c).apply(); }); Button off=new Button(this); off.setText(\"PLAY OFFLINE - GOOOL!\"); lay.addView(off); off.setOnClickListener(v->{ getSharedPreferences(\"game\",0).edit().putString(\"room\",\"OFFLINE\").apply(); startActivity(new Intent(this,MainActivity.class)); }); code.setOnClickListener(v->startActivity(new Intent(this,MainActivity.class))); setContentView(lay); }}" > app/src/main/java/com/ghostfootball/game/MenuActivity.java
          
          cat > app/src/main/java/com/ghostfootball/game/CommentatorManager.java <<'EOF'
          package com.ghostfootball.game; import android.content.Context; import android.speech.tts.TextToSpeech; import java.util.Locale; import java.util.Random; public class CommentatorManager { TextToSpeech tts; Random rand=new Random(); String[] goals={"GOOOOOL! CHE GOLAZO!","MAMMA MIA! CHE GOL FANTASTICO!","RETE! GOL BELLISSIMO!","GOL! GOL! INCREDIBILE!"}; public CommentatorManager(Context ctx){ tts=new TextToSpeech(ctx,status->{ if(status==TextToSpeech.SUCCESS){ tts.setLanguage(new Locale("it","IT")); tts.setSpeechRate(1.1f); speak("Si parte! Forza ragazzi!"); }}); } void speak(String t){ if(tts!=null) tts.speak(t,TextToSpeech.QUEUE_FLUSH,null,null); } void onGoal(){ speak(goals[rand.nextInt(goals.length)]); } }
          EOF
          
          cat > app/src/main/java/com/ghostfootball/game/MainActivity.java <<'EOF'
          package com.ghostfootball.game; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { FootballView gv; CommentatorManager cm; protected void onCreate(Bundle b){ super.onCreate(b); cm=new CommentatorManager(this); gv=new FootballView(this,null); gv.setRoom(getSharedPreferences("game",0).getString("room","OFFLINE"),cm); setContentView(gv); } protected void onPause(){ super.onPause(); gv.pause(); } protected void onResume(){ super.onResume(); gv.resume(); } }
          EOF
          
          cat > app/src/main/java/com/ghostfootball/game/FootballView.java <<'EOF'
          package com.ghostfootball.game; import android.content.Context; import android.graphics.*; import android.util.AttributeSet; import android.view.MotionEvent; import android.view.SurfaceView; public class FootballView extends SurfaceView implements Runnable { Thread th; boolean play; Paint p; float bx=540,by=960,bvx=0,bvy=0,px=400,py=960,ex=680,ey=960; int s1=0,s2=0; float jx=0,jy=0; boolean sp=false; CommentatorManager com; String room="OFFLINE"; public FootballView(Context c,AttributeSet a){ super(c,a); p=new Paint(); } public void setRoom(String r,CommentatorManager c){ room=r; com=c; } public void resume(){ play=true; th=new Thread(this); th.start(); } public void pause(){ play=false; try{th.join();}catch(Exception e){} } public boolean onTouchEvent(MotionEvent e){ if(e.getAction()==2||e.getAction()==0){ jx=(e.getX()-200)/100f; jy=(e.getY()-600)/100f; } return true; } public void run(){ while(play){ float s=sp?8:4; px+=jx*s; py+=jy*s; if(Math.hypot(px-bx,py-by)<50){ bx=px+20; by=py; } bx+=bvx; by+=bvy; bvx*=0.98f; bvy*=0.98f; ex+=(bx-ex)*0.02f; ey+=(by-ey)*0.02f; if(bx<0||bx>1080) bvx*=-1; if(by<0||by>1920) bvy*=-1; if(by>400&&by<900){ if(bx<30){ s2++; if(com!=null) com.onGoal(); bx=540; by=960; } if(bx>1050){ s1++; if(com!=null) com.onGoal(); bx=540; by=960; } } try{Thread.sleep(16);}catch(Exception ex){} android.graphics.Canvas cv=getHolder().lockCanvas(); if(cv==null) continue; cv.drawColor(0xFF228B22); p.setColor(0xFFFFFFFF); p.setStrokeWidth(5); p.setStyle(Paint.Style.STROKE); cv.drawRect(50,50,1030,1870,p); cv.drawLine(50,960,1030,960,p); cv.drawCircle(540,960,100,p); p.setStyle(Paint.Style.FILL); cv.drawRect(0,400,30,900,p); cv.drawRect(1050,400,1080,900,p); p.setColor(0xFF0000FF); cv.drawCircle(px,py,28,p); p.setColor(0xFFFF0000); cv.drawCircle(ex,ey,28,p); p.setColor(0xFFFFFFFF); cv.drawCircle(bx,by,16,p); p.setTextSize(55); cv.drawText(s1+" - "+s2,450,120,p); p.setTextSize(28); cv.drawText(room+" 🇮🇹",40,1900,p); getHolder().unlockCanvasAndPost(cv); } } }
          EOF
          
          echo '{"project_info":{"project_number":"123","project_id":"ghost-football"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.ghostfootball.game"}},"api_key":[{"current_key":"fake"}]}]}' > app/google-services.json

      - name: Build APK
        run: |
          wget https://services.gradle.org/distributions/gradle-8.0-bin.zip -q
          unzip -q gradle-8.0-bin.zip
          ./gradle-8.0/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Football-Online-APK-FIXED
          path: app/build/outputs/apk/debug/*.apk
